# Hostinger-এর জন্য বিল্ড: main-এ push হলে GitHub-এ বিল্ড করে তৈরি অ্যাপ "deploy" শাখায় রাখে।
# Hostinger-এ শাখা হিসেবে "deploy" বেছে নিন। (কারণ: Hostinger-এর পুরোনো Linux-এ Next.js 16-এর compiler চলে না।)
# দরকারি Secrets (GitHub → Settings → Secrets and variables → Actions): DATABASE_URL, APP_URL
name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_MAX_UPLOAD_MB: "4"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Make deploy bundle
        run: node scripts/make-deploy-bundle.mjs "$RUNNER_TEMP/deploy-out"

      - name: Push to deploy branch
        working-directory: ${{ runner.temp }}/deploy-out
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
