<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইন্টারনেট নেই — BCS ৫২ প্রস্তুতি</title>
<style>
  :root { color-scheme: light dark; --paper: #f4f6f3; --ink: #1c2733; --muted: #616d78; --green: #006a4e; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0e1412; --ink: #e6ece8; --muted: #8d9993; --green: #3dbb8b; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
    font: 17px/1.7 "Noto Sans Bengali", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0; }
  button { margin-top: 20px; font: inherit; font-weight: 600; color: #fff; background: var(--green); border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#006a4e"/><g fill="none" stroke="#fff" stroke-width="2"><circle cx="10" cy="10" r="3.7"/><circle cx="10" cy="22" r="3.7"/><circle cx="22" cy="22" r="3.7"/></g><circle cx="22" cy="10" r="4.9" fill="#f42a41"/></svg>
  <h1>ইন্টারনেট সংযোগ নেই</h1>
  <p>সংযোগ ফিরে এলে আবার চেষ্টা করুন। আপনার অগ্রগতি সার্ভারে সংরক্ষিত আছে, কিছু হারায়নি।</p>
  <button onclick="location.reload()">আবার চেষ্টা করুন</button>
</main>
</body>
</html>
